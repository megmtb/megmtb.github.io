<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable | Meg M.T.B.</title>
  <meta name="robots" content="noindex">

  <meta name="theme-color" content="#08080f">
  <meta name="color-scheme" content="dark">

  <!-- Google Analytics : seulement si le visiteur a accepté sur le site -->
  <script>
    try {
      if (localStorage.getItem('cookie-consent-v2') === 'granted') {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-J6J8FDWQBG';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-J6J8FDWQBG', { page_title: '404, page introuvable' });
      }
    } catch (e) {}
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Space Grotesk',system-ui,sans-serif;
      background:#08080f;color:#fff;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;text-align:center;line-height:1.5;
    }
    .wrap{max-width:480px}
    .code{
      font-size:clamp(5rem,18vw,9rem);font-weight:800;
      color:#E87F24;line-height:1;margin-bottom:14px;letter-spacing:-.04em;
    }
    h1{font-size:1.6rem;margin-bottom:14px;font-weight:700}
    p{color:#8a93a3;margin-bottom:32px;font-size:.95rem}
    a{
      display:inline-flex;align-items:center;gap:8px;
      padding:13px 24px;border-radius:10px;
      background:#E87F24;color:#fff;font-weight:700;font-size:.9rem;
      text-decoration:none;transition:filter .2s,transform .2s;
    }
    a:hover{filter:brightness(1.1);transform:translateY(-2px)}
    a:focus-visible{outline:2px solid #FEFDDF;outline-offset:3px}
    @media (prefers-reduced-motion: reduce){a{transition:none}a:hover{transform:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code" aria-hidden="true">404</div>
    <h1>Game Over. Page introuvable.</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <a href="/"><span aria-hidden="true">←</span> Retour à l'accueil</a>
  </main>
</body>
</html>
